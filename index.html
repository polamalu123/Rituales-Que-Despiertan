<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aether ☽ — Rituales que despiertan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Jost',sans-serif;background:#faf7f2;color:#2e2416}
@keyframes spin{to{transform:rotate(360deg)}}
@media print{
  body *{visibility:hidden!important}
  #ticket,#ticket *{visibility:visible!important}
  #ticket{position:absolute!important;left:0;top:0;width:100%!important;max-width:380px;box-shadow:none!important;border-radius:0!important}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

/* ── CONFIG ── */
const SB_URL="https://utwpumtpgcolkavqbmmh.supabase.co";
const SB_KEY="sb_publishable_Y4ktViRftcIlT5hNWmskQg_lvwBSUje";
const BUCKET="1234";

const hdrs=()=>({"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"});
const db=async(table,params="")=>{const r=await fetch(SB_URL+"/rest/v1/"+table+params,{headers:hdrs()});return r.json();};
const dbw=async(table,method,data,params="")=>{const r=await fetch(SB_URL+"/rest/v1/"+table+params,{method,headers:{...hdrs(),"Prefer":"return=representation"},body:JSON.stringify(data)});return r.json();};
const dbdel=async(table,params)=>fetch(SB_URL+"/rest/v1/"+table+params,{method:"DELETE",headers:hdrs()});
const dbup=async(table,data,conflict)=>{const r=await fetch(SB_URL+"/rest/v1/"+table+"?on_conflict="+conflict,{method:"POST",headers:{...hdrs(),"Prefer":"resolution=merge-duplicates,return=representation"},body:JSON.stringify(data)});return r.json();};

/* ── PIN ── */
const getPin=()=>localStorage.getItem("aether_pin")||"1234";

/* ── ZONAS DE COBERTURA (CP → zona) ── */
const CP_ZONA={};
const addRango=(zona,desde,hasta,paso=10)=>{
  for(let n=desde;n<=hasta;n+=paso)CP_ZONA[String(n).padStart(5,"0")]=zona;
};
const addLista=(zona,lista)=>lista.forEach(c=>{CP_ZONA[c]=zona;});

// Nezahualcóyotl
addRango("Neza",57000,57990);
addLista("Neza",["57003","57103","57129","57138","57139","57158","57171","57178","57179","57185"]);
// Chimalhuacán (parte oeste)
for(let d=5633;d<=5639;d++){
  [0,4,5,6,7,8,9].forEach(u=>{CP_ZONA[String(d)+u]="Chimalhuacán";});
}
// Iztapalapa
addRango("Iztapalapa",9000,9890);
// Gustavo A. Madero
addRango("Gustavo A. Madero",7000,7990);
// Venustiano Carranza
addRango("Venustiano Carranza",15000,15990);
// Iztacalco
addRango("Iztacalco",8000,8990);
// Cuauhtémoc
addRango("Cuauhtémoc",6000,6990);
// Ecatepec
addRango("Ecatepec",55000,55550);
// Ixtapaluca
addLista("Ixtapaluca",["56530","56535","56536","56537","56540","56545","56550","56553","56555","56560","56565","56566","56567","56568","56569","56570","56573","56574","56575","56576","56577","56578","56579","56580","56583","56585","56586","56587","56588","56589","56590","56593","56594","56595","56596","56597","56598","56599"]);

// Base + cambios hechos desde Admin (tabla zonas_cp: cp, zona, activo)
const mapaCP=(rows)=>{
  const m={...CP_ZONA};
  (Array.isArray(rows)?rows:[]).forEach(r=>{
    if(!r||!r.cp)return;
    if(r.activo===false)delete m[r.cp];else m[r.cp]=r.zona;
  });
  return m;
};

/* ── DATOS ── */
const CATS=["Veladoras","Incienso","Protecciones","Hierbas en té","Hierbas para baño","Sales","Esencias y concentrados","Alcoholes","Accesorios","Cuarzos"];
const ST_LABELS={nuevo:"🆕 Nuevo",confirmado:"✅ Confirmado",enviado:"🚚 Enviado",entregado:"🏠 Entregado",cancelado:"❌ Cancelado"};
const ST_COLORS={nuevo:"#c8902a",confirmado:"#2d7a2d",enviado:"#1a6fa0",entregado:"#5a3d8a",cancelado:"#c0392b"};
const FAQS=[
  {q:"¿Cómo pago?",a:"Pago por transferencia bancaria. Al confirmar tu pedido te enviamos los datos por WhatsApp."},
  {q:"¿A qué zonas entregan?",a:"Sin costo en Neza, Chimalhuacán, Ixtapaluca, Iztapalapa, Gustavo A. Madero, Venustiano Carranza, Iztacalco, Cuauhtémoc y Ecatepec. Fuera de esa zona enviamos por paquetería."},
  {q:"¿Cuánto tarda el envío?",a:"En zona de cobertura 1–2 días hábiles. Por paquetería 3–5 días."},
  {q:"¿Puedo cancelar mi pedido?",a:"Sí, contáctanos por WhatsApp antes de que el pedido salga a envío."},
  {q:"¿Los productos están consagrados?",a:"Cada producto pasa por una limpieza energética antes de empacarse."},
];
const folio=()=>"AE"+Date.now().toString(36).toUpperCase().slice(-6);

/* ── UI HELPERS ── */
const I=(extra={})=>({width:"100%",padding:"9px 12px",border:"1.5px solid #e0d8cc",borderRadius:10,fontFamily:"'Jost',sans-serif",fontSize:13,outline:"none",background:"white",...extra});
const B=(bg="#1a1510",extra={})=>({width:"100%",padding:13,background:bg,color:"white",border:"none",borderRadius:50,fontFamily:"'Jost',sans-serif",fontSize:14,cursor:"pointer",fontWeight:500,...extra});
const Toast=({msg})=><div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#1a1510",color:"#faf7f2",padding:"10px 22px",borderRadius:50,fontSize:13,zIndex:9999,pointerEvents:"none",whiteSpace:"nowrap",boxShadow:"0 8px 30px rgba(0,0,0,0.3)"}}>{msg}</div>;
const Spin=()=><div style={{display:"flex",alignItems:"center",justifyContent:"center",padding:60}}><div style={{width:32,height:32,border:"3px solid #e0d8cc",borderTop:"3px solid #c8902a",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/></div>;

/* ── TICKET ── */
const money=n=>"$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtFecha=d=>new Date(d).toLocaleString("es-MX",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const waMsg=(t,cfg)=>{
  const lista=t.items.map(p=>"• "+p.nombre+(p.cantidad>1?" x"+p.cantidad:"")+" — "+money(p.precio*p.cantidad)).join("\n");
  const envio=t.envio==="cobertura"?"🚚 Envío sin costo":"📦 Envío por paquetería";
  const banco=cfg.clabe?"\n\n💳 Datos de pago:\n"+(cfg.banco||"")+" — CLABE: "+cfg.clabe+"\nTitular: "+(cfg.titular||""):"";
  return "🌙 *NUEVO PEDIDO — Folio "+t.folio+"*\n\n"+lista+"\n\n💰 Total: "+money(t.total)+"\n"+envio+"\n\n📍 Dirección:\n"+t.dir+"\n\n👤 "+t.nombre+" · 📞 "+t.telefono+banco;
};
function Ticket({t,cfg,onClose,waUrl,waLabel}){
  const sep={borderTop:"1px dashed #b9ad98",margin:"12px 0"};
  const row={display:"flex",justifyContent:"space-between",gap:12,fontSize:13,padding:"3px 0"};
  return(
    <div className="ticket-overlay" style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:700,overflowY:"auto",padding:"20px 12px 40px",display:"flex",flexDirection:"column",alignItems:"center",gap:14}}>
      <div id="ticket" style={{background:"white",width:"min(100%,360px)",borderRadius:6,padding:"22px 20px",boxShadow:"0 10px 40px rgba(0,0,0,0.35)",color:"#1a1510",fontFamily:"'Jost',sans-serif"}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:26,fontWeight:600}}>☽ Aether</div>
          <div style={{fontSize:11,letterSpacing:"0.12em",color:"#7a6e60"}}>RITUALES QUE DESPIERTAN</div>
        </div>
        <div style={sep}/>
        <div style={row}><span style={{color:"#7a6e60"}}>Folio</span><b>{t.folio}</b></div>
        <div style={row}><span style={{color:"#7a6e60"}}>Fecha</span><span>{fmtFecha(t.fecha)}</span></div>
        <div style={row}><span style={{color:"#7a6e60"}}>Cliente</span><span style={{textAlign:"right"}}>{t.nombre}</span></div>
        <div style={row}><span style={{color:"#7a6e60"}}>Teléfono</span><span>{t.telefono}</span></div>
        <div style={{...row,display:"block",paddingTop:6}}><span style={{color:"#7a6e60"}}>Entrega: </span><span>{t.dir}</span></div>
        <div style={sep}/>
        {t.items.map((it,i)=>(
          <div key={i} style={row}>
            <span>{it.nombre}{it.cantidad>1?" ×"+it.cantidad:""}</span>
            <span style={{whiteSpace:"nowrap"}}>{money(it.precio*it.cantidad)}</span>
          </div>
        ))}
        <div style={sep}/>
        <div style={row}><span style={{color:"#7a6e60"}}>Envío</span><span>{t.envio==="cobertura"?"Sin costo":"Paquetería (a confirmar)"}</span></div>
        <div style={{...row,fontSize:17,fontWeight:600,marginTop:4}}><span>TOTAL</span><span style={{color:"#c8902a"}}>{money(t.total)}</span></div>
        <div style={sep}/>
        <div style={{fontSize:12,textAlign:"center",color:"#c8902a",fontWeight:600,marginBottom:6}}>PAGO PENDIENTE</div>
        {cfg&&cfg.clabe?(
          <div style={{fontSize:12,lineHeight:1.7,textAlign:"center"}}>
            {cfg.banco&&<div>{cfg.banco}</div>}
            <div>CLABE: <b>{cfg.clabe}</b></div>
            {cfg.titular&&<div>Titular: {cfg.titular}</div>}
            <div>Concepto: {cfg.concepto||t.folio}</div>
          </div>
        ):<div style={{fontSize:12,textAlign:"center",color:"#7a6e60"}}>Te enviaremos los datos de pago por WhatsApp.</div>}
        <div style={sep}/>
        <div style={{fontSize:11,textAlign:"center",color:"#7a6e60",lineHeight:1.6}}>Envía tu comprobante de pago por WhatsApp.<br/>¡Gracias por tu compra! ☽</div>
      </div>
      <div className="no-print" style={{width:"min(100%,360px)",display:"flex",flexDirection:"column",gap:10}}>
        {waUrl&&<a href={waUrl} target="_blank" rel="noopener noreferrer" style={{...B("#25D366"),display:"block",textAlign:"center",textDecoration:"none"}}>{waLabel||"Enviar por WhatsApp 📲"}</a>}
        <button onClick={()=>window.print()} style={B("#c8902a")}>🖨 Imprimir / Guardar PDF</button>
        <button onClick={onClose} style={B("transparent",{border:"1.5px solid rgba(255,255,255,0.6)"})}>Cerrar</button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   TIENDA
══════════════════════════════════════════════ */
function Tienda({onAdmin}){
  const [prods,setProds]=useState([]);
  const [cfg,setCfg]=useState({});
  const [filtro,setFiltro]=useState("Todos");
  const [busq,setBusq]=useState("");
  const [carrito,setCarrito]=useState([]);
  const [drawer,setDrawer]=useState(false);
  const [addr,setAddr]=useState({nombre:"",telefono:"",calle:"",colonia:"",cp:"",alcaldia:"",refs:""});
  const [cpSt,setCpSt]=useState(null);
  const [zmap,setZmap]=useState(CP_ZONA);
  const [ticket,setTicket]=useState(null);
  const [toast,setToast]=useState("");
  const [loading,setLoading]=useState(true);
  const [enviando,setEnviando]=useState(false);
  const [faqOpen,setFaqOpen]=useState(false);
  const [faqIdx,setFaqIdx]=useState(null);

  const toast2=msg=>{setToast(msg);setTimeout(()=>setToast(""),2500);};

  useEffect(()=>{
    (async()=>{
      try{
        const [p,c,z]=await Promise.all([
          db("productos","?select=*&activo=eq.true&order=id.asc"),
          db("config","?select=clave,valor"),
          db("zonas_cp","?select=*").catch(()=>[]),
        ]);
        setZmap(mapaCP(z));
        setProds(Array.isArray(p)?p:[]);
        if(Array.isArray(c)){const m={};c.forEach(r=>m[r.clave]=r.valor);setCfg(m);}
      }catch(e){}
      setLoading(false);
    })();
  },[]);

  const cats=["Todos",...CATS.filter(c=>prods.some(p=>p.categoria===c))];
  const vis=prods.filter(p=>(filtro==="Todos"||p.categoria===filtro)&&(!busq||p.nombre.toLowerCase().includes(busq.toLowerCase())));
  const total=carrito.reduce((s,p)=>s+p.precio,0);
  const inCart=id=>carrito.some(c=>c.id===id);
  const add=p=>{if(!inCart(p.id)){setCarrito(pr=>[...pr,p]);toast2("✦ "+p.nombre+" añadido");}};
  const rm=id=>setCarrito(pr=>pr.filter(c=>c.id!==id));
  const verCP=cp=>{
    setAddr(a=>({...a,cp,alcaldia:zmap[cp]||""}));
    if(cp.length===5)setCpSt(zmap[cp]?"in":"out");
    else setCpSt(null);
  };

  const confirmar=async()=>{
    if(!carrito.length)return;
    if(!addr.nombre||!addr.telefono||!addr.calle||!addr.cp){toast2("⚠️ Completa nombre, teléfono, calle y CP");return;}
    setEnviando(true);
    try{
      const f=folio();
      const ped=await dbw("pedidos","POST",{folio:f,cliente_nombre:addr.nombre,cliente_telefono:addr.telefono,cliente_calle:addr.calle,cliente_colonia:addr.colonia,cliente_cp:addr.cp,cliente_alcaldia:addr.alcaldia,cliente_referencias:addr.refs,total,tipo_envio:cpSt==="in"?"cobertura":"paqueteria",status:"nuevo"});
      const pid=Array.isArray(ped)?ped[0]?.id:ped?.id;
      if(pid)await dbw("pedido_items","POST",carrito.map(p=>({pedido_id:pid,producto_id:p.id,nombre:p.nombre,precio:p.precio,cantidad:1})));
      const dir=addr.calle+", Col. "+addr.colonia+", CP "+addr.cp+(addr.alcaldia?", "+addr.alcaldia:"")+(addr.refs?" ("+addr.refs+")":"");
      setTicket({folio:f,fecha:new Date().toISOString(),nombre:addr.nombre,telefono:addr.telefono,dir,items:carrito.map(p=>({nombre:p.nombre,precio:p.precio,cantidad:1})),total,envio:cpSt==="in"?"cobertura":"paqueteria"});
      setCarrito([]);setAddr({nombre:"",telefono:"",calle:"",colonia:"",cp:"",alcaldia:"",refs:""});setCpSt(null);setDrawer(false);
      toast2("✅ Pedido "+f+" creado");
    }catch(e){toast2("Error al crear pedido");}
    setEnviando(false);
  };

  if(loading)return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Cormorant Garamond',serif",fontSize:"1.5rem",color:"#c8902a"}}>☽ Cargando…</div>;

  return(
    <div style={{fontFamily:"'Jost',sans-serif",background:"#faf7f2",minHeight:"100vh"}}>
      {/* NAV */}
      <nav style={{position:"sticky",top:0,zIndex:100,background:"rgba(250,247,242,0.95)",backdropFilter:"blur(12px)",borderBottom:"1px solid #e0d8cc",padding:"0 20px",height:60,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:22,fontWeight:600}}><span style={{color:"#c8902a"}}>☽</span> Aether<span style={{color:"#c8902a"}}>.</span></div>
        <button onClick={()=>setDrawer(true)} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 16px",border:"1.5px solid #1a1510",borderRadius:50,background:"transparent",cursor:"pointer",fontSize:13,position:"relative"}}>
          🛍 Carrito
          {carrito.length>0&&<span style={{position:"absolute",top:-6,right:-6,width:18,height:18,background:"#c8902a",color:"white",borderRadius:"50%",fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>{carrito.length}</span>}
        </button>
      </nav>

      {/* HERO */}
      <div style={{background:"#1a1208",padding:"70px 20px 60px",textAlign:"center",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse 60% 50% at 40% 50%, rgba(200,144,42,0.15), transparent)"}}/>
        <div style={{position:"relative",zIndex:1}}>
          <div style={{display:"inline-flex",alignItems:"center",gap:8,padding:"6px 18px",border:"1px solid rgba(200,144,42,0.35)",borderRadius:50,color:"rgba(240,220,180,0.8)",fontSize:12,marginBottom:24}}>✦ Energía consagrada · Envío en zona seleccionada</div>
          <h1 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(2.4rem,8vw,4rem)",fontWeight:300,color:"#f0e8d4",lineHeight:1.1,marginBottom:8}}>Rituales que<br/><em style={{color:"#e0aa4a"}}>despiertan</em></h1>
          <p style={{color:"rgba(240,220,180,0.55)",fontSize:14,maxWidth:320,margin:"20px auto 0",lineHeight:1.7}}>Velas, cuarzos, inciensos y herramientas místicas elegidas a mano.</p>
        </div>
      </div>

      {/* CATÁLOGO */}
      <div style={{maxWidth:480,margin:"0 auto",padding:"40px 16px 100px"}}>
        <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"2rem",fontWeight:400,marginBottom:20}}>Catálogo</h2>
        <div style={{position:"relative",marginBottom:18}}>
          <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)"}}>🔍</span>
          <input value={busq} onChange={e=>setBusq(e.target.value)} placeholder="Buscar producto…" style={{...I(),padding:"12px 14px 12px 40px",borderRadius:50}}/>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:28}}>
          {cats.map(c=><button key={c} onClick={()=>setFiltro(c)} style={{padding:"7px 16px",borderRadius:50,border:"1.5px solid "+(filtro===c?"#c8902a":"#e0d8cc"),background:filtro===c?"#c8902a":"white",color:filtro===c?"white":"#2e2416",cursor:"pointer",fontSize:13}}>{c}</button>)}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          {vis.length===0&&<div style={{textAlign:"center",padding:60,color:"#7a6e60"}}>🌙 Sin productos</div>}
          {vis.map(p=>(
            <div key={p.id} style={{background:"white",borderRadius:20,border:"1px solid #e0d8cc",overflow:"hidden"}}>
              <div style={{width:"100%",aspectRatio:"4/3",background:p.imagen_url?"url("+p.imagen_url+") center/cover":"#f0ecf5",backgroundSize:"cover",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"3.5rem"}}>{!p.imagen_url&&(p.emoji||"✨")}</div>
              <div style={{padding:"14px 16px 16px"}}>
                <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.3rem",marginBottom:4}}>{p.nombre}</div>
                <div style={{fontSize:13,color:"#7a6e60",marginBottom:12,lineHeight:1.5}}>{p.descripcion}</div>
                {p.stock<=3&&p.stock>0&&<div style={{fontSize:11,color:"#c8902a",marginBottom:8}}>⚡ Últimas {p.stock} unidades</div>}
                {p.stock===0&&<div style={{fontSize:11,color:"#999",marginBottom:8}}>Sin stock</div>}
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <span style={{fontSize:"1.1rem",fontWeight:500,color:"#c8902a"}}>${p.precio}.00</span>
                  <button onClick={()=>add(p)} disabled={p.stock===0} style={{padding:"9px 22px",borderRadius:50,border:"none",background:inCart(p.id)?"#1a1510":"#c8902a",color:"white",cursor:p.stock===0?"not-allowed":"pointer",fontSize:13,opacity:p.stock===0?0.4:1}}>
                    {inCart(p.id)?"✓ Agregado":"Agregar"}
                  </button>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* DRAWER */}
      {drawer&&<div onClick={()=>setDrawer(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:200}}/>}
      <div style={{position:"fixed",right:0,top:0,bottom:0,width:"min(92vw,390px)",background:"#faf7f2",zIndex:201,transform:drawer?"translateX(0)":"translateX(100%)",transition:"transform 0.35s cubic-bezier(0.4,0,0.2,1)",display:"flex",flexDirection:"column",boxShadow:"-20px 0 60px rgba(0,0,0,0.15)"}}>
        <div style={{padding:"18px 20px 14px",borderBottom:"1px solid #e0d8cc",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.4rem",fontWeight:600}}>☽ Tu Carrito</span>
          <button onClick={()=>setDrawer(false)} style={{width:34,height:34,border:"1.5px solid #e0d8cc",borderRadius:"50%",background:"transparent",cursor:"pointer",fontSize:14,color:"#7a6e60"}}>✕</button>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"14px 20px"}}>
          {carrito.length===0
            ?<div style={{textAlign:"center",padding:"50px 0",color:"#7a6e60"}}>🌙 Tu carrito está vacío</div>
            :carrito.map(p=>(
              <div key={p.id} style={{display:"flex",gap:12,alignItems:"center",padding:"10px 0",borderBottom:"1px solid #e0d8cc"}}>
                <div style={{width:48,height:48,background:p.imagen_url?"url("+p.imagen_url+") center/cover":"#f0ecf5",backgroundSize:"cover",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.3rem",flexShrink:0}}>{!p.imagen_url&&p.emoji}</div>
                <div style={{flex:1}}>

function Admin({onSalir}){
  const [sec,setSec]=useState("pedidos");
  const [pedidos,setPedidos]=useState([]);
  const [prods,setProds]=useState([]);
  const [cfg,setCfg]=useState([]);
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState("");
  const [detalle,setDetalle]=useState(null);
  const [editP,setEditP]=useState(null);
  const [filtroSt,setFiltroSt]=useState("todos");
  const t=msg=>{setToast(msg);setTimeout(()=>setToast(""),2500);};

  useEffect(()=>{
    (async()=>{
      try{
        const [pe,pr,c]=await Promise.all([
          db("pedidos","?select=*&order=created_at.desc"),
          db("productos","?select=*&order=id.asc"),
          db("config","?select=*"),
        ]);
        setPedidos(Array.isArray(pe)?pe:[]);
        setProds(Array.isArray(pr)?pr:[]);
        setCfg(Array.isArray(c)?c:[]);
      }catch(e){}
      setLoading(false);
    })();
  },[]);

  const hoy=new Date().toISOString().slice(0,10);
  const hoyP=pedidos.filter(p=>p.created_at?.slice(0,10)===hoy);
  const ventasH=hoyP.filter(p=>p.status!=="cancelado").reduce((s,p)=>s+Number(p.total),0);
  const nuevos=pedidos.filter(p=>p.status==="nuevo").length;

  const cambSt=async(id,status)=>{
    await dbw("pedidos","PATCH",{status},"?id=eq."+id);
    setPedidos(pr=>pr.map(p=>p.id===id?{...p,status}:p));
    if(detalle?.id===id)setDetalle(pr=>({...pr,status}));
    t("✦ Status actualizado");
  };

  const guardarP=async(form)=>{
    const d={nombre:form.nombre,descripcion:form.descripcion,precio:Number(form.precio),stock:Number(form.stock),categoria:form.categoria,emoji:form.emoji||"✨",activo:form.activo,imagen_url:form.imagen_url||null};
    if(form.id){
      await dbw("productos","PATCH",d,"?id=eq."+form.id);
      setProds(pr=>pr.map(p=>p.id===form.id?{...p,...d}:p));
    }else{
      const n=await dbw("productos","POST",d);
      if(Array.isArray(n)&&n[0])setProds(pr=>[...pr,n[0]]);
    }
    setEditP(null);t("✦ Producto guardado");
  };

  const elimP=async(id)=>{
    await dbdel("productos","?id=eq."+id);
    setProds(pr=>pr.filter(p=>p.id!==id));
    setEditP(null);t("Producto eliminado");
  };

  const guardarCfg=async(items)=>{
    await Promise.all(items.map(i=>dbw("config","PATCH",{valor:i.valor},"?clave=eq."+i.clave)));
    setCfg(items);t("✦ Config guardada");
  };

  const pedF=filtroSt==="todos"?pedidos:pedidos.filter(p=>p.status===filtroSt);

  if(loading)return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}><Spin/></div>;

  return(
    <div style={{fontFamily:"'Jost',sans-serif",background:"#f5f0e8",minHeight:"100vh"}}>
      <div style={{background:"#1a1510",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,color:"#f0e8d4",fontWeight:600}}>☽ Aether <span style={{color:"#c8902a",fontSize:13,fontWeight:400}}>Admin</span></div>
        <button onClick={onSalir} style={{fontSize:12,color:"rgba(240,220,180,0.6)",background:"none",border:"1px solid rgba(240,220,180,0.2)",borderRadius:50,padding:"5px 14px",cursor:"pointer"}}>Ver tienda</button>
      </div>

      {/* STATS */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,padding:"16px",maxWidth:480,margin:"0 auto"}}>
        {[{l:"Pedidos hoy",v:hoyP.length,i:"📦"},{l:"Ventas hoy",v:"$"+ventasH,i:"💰"},{l:"Sin confirmar",v:nuevos,i:"🆕"}].map(s=>(
          <div key={s.l} style={{background:"white",borderRadius:14,padding:"12px 10px",textAlign:"center",border:"1px solid #e0d8cc"}}>
            <div style={{fontSize:20,marginBottom:4}}>{s.i}</div>
            <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.3rem",fontWeight:600}}>{s.v}</div>
            <div style={{fontSize:11,color:"#7a6e60"}}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* TABS */}
      <div style={{display:"flex",borderBottom:"2px solid #e0d8cc",background:"white",padding:"0 16px",maxWidth:480,margin:"0 auto"}}>
        {[["pedidos","📋 Pedidos"],["productos","📦 Productos"],["config","⚙️ Config"]].map(([k,l])=>(
          <button key={k} onClick={()=>setSec(k)} style={{padding:"13px 14px",border:"none",background:"transparent",cursor:"pointer",fontSize:13,fontWeight:500,color:sec===k?"#c8902a":"#7a6e60",borderBottom:sec===k?"2px solid #c8902a":"2px solid transparent",marginBottom:-2}}>{l}</button>
        ))}
      </div>

      <div style={{maxWidth:480,margin:"0 auto",padding:"20px 16px 80px"}}>

        {/* PEDIDOS */}
        {sec==="pedidos"&&(
          <>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
              {[["todos","Todos"],["nuevo","🆕 Nuevos"],["confirmado","✅ Conf."],["enviado","🚚 Env."],["entregado","🏠 Entr."],["cancelado","❌ Canc."]].map(([k,l])=>(
                <button key={k} onClick={()=>setFiltroSt(k)} style={{padding:"5px 12px",borderRadius:50,border:"1.5px solid "+(filtroSt===k?"#c8902a":"#e0d8cc"),background:filtroSt===k?"#c8902a":"white",color:filtroSt===k?"white":"#2e2416",cursor:"pointer",fontSize:12}}>{l}</button>
              ))}
            </div>
            {pedF.length===0&&<div style={{textAlign:"center",padding:60,color:"#7a6e60"}}>🌙 Sin pedidos</div>}
            {pedF.map(p=>(
              <div key={p.id} onClick={()=>setDetalle(p)} style={{background:"white",borderRadius:16,border:"1px solid #e0d8cc",padding:"14px 16px",marginBottom:10,cursor:"pointer"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                  <div>
                    <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,fontWeight:600}}>{p.folio}</div>
                    <div style={{fontSize:12,color:"#7a6e60"}}>{p.cliente_nombre} · {p.cliente_telefono}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:16,fontWeight:600,color:"#c8902a"}}>${p.total}</div>
                    <span style={{fontSize:11,padding:"2px 8px",borderRadius:50,background:ST_COLORS[p.status]+"22",color:ST_COLORS[p.status]}}>{ST_LABELS[p.status]}</span>
                  </div>
                </div>
                <div style={{fontSize:12,color:"#7a6e60"}}>{p.tipo_envio==="cobertura"?"🚚 Sin costo":"📦 Paquetería"} · {new Date(p.created_at).toLocaleDateString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
              </div>
            ))}
          </>
        )}

        {/* PRODUCTOS */}
        {sec==="productos"&&(
          <>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.5rem"}}>Productos</div>
              <button onClick={()=>setEditP({id:null,nombre:"",descripcion:"",precio:0,stock:0,categoria:CATS[0],emoji:"✨",imagen_url:null,activo:true})} style={{...B("#c8902a",{width:"auto",padding:"8px 16px"})}}>+ Nuevo</button>
            </div>
            {prods.map(p=>(
              <div key={p.id} style={{background:"white",borderRadius:14,border:"1px solid #e0d8cc",padding:"12px 14px",marginBottom:10,display:"flex",gap:12,alignItems:"center"}}>
                <div style={{width:52,height:52,borderRadius:10,background:p.imagen_url?"url("+p.imagen_url+") center/cover":"#f0ecf5",backgroundSize:"cover",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.5rem",flexShrink:0}}>{!p.imagen_url&&p.emoji}</div>
                <div style={{flex:1}}>
                  <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:15,fontWeight:600}}>{p.nombre}</div>
                  <div style={{fontSize:12,color:"#7a6e60",display:"flex",gap:8,marginTop:3}}>
                    <span style={{color:"#c8902a",fontWeight:500}}>${p.precio}</span>
                    <span style={{color:p.stock>3?"#2d7a2d":p.stock>0?"#c8902a":"#999"}}>Stock: {p.stock}</span>
                    {!p.activo&&<span style={{color:"#999"}}>Oculto</span>}
                  </div>

                <button onClick={()=>setEditP({...p})} style={{padding:"6px 14px",border:"1.5px solid #e0d8cc",borderRadius:50,background:"transparent",cursor:"pointer",fontSize:12}}>Editar</button>
              </div>
            ))}
          </>
        )}

        {/* CONFIG */}
        {sec==="config"&&<><ConfigForm cfg={cfg} onGuardar={guardarCfg}/><ZonasCP/></>}
      </div>

      {detalle&&<DetallePed ped={detalle} cfg={Object.fromEntries(cfg.map(c=>[c.clave,c.valor]))} onClose={()=>setDetalle(null)} onSt={cambSt}/>}

      {toast&&<Toast msg={toast}/>}
    </div>
  );

/* ── EDITOR PRODUCTO ── */
function EditorProd({prod,onGuardar,onClose,onElim}){
  const [form,setForm]=useState({...prod});
  const [sub,setSub]=useState(false);
  const [conf,setConf]=useState(false);
  const s=(k,v)=>setForm(f=>({...f,[k]:v}));

  const subirFoto=async(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    setSub(true);
    try{
      const ext=file.name.split(".").pop();
      const nom="prod_"+Date.now()+"."+ext;
      const r=await fetch(SB_URL+"/storage/v1/object/"+BUCKET+"/"+nom,{
        method:"POST",
        headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":file.type,"x-upsert":"true"},
        body:file
      });
      if(r.ok)s("imagen_url",SB_URL+"/storage/v1/object/public/"+BUCKET+"/"+nom);
      else{const err=await r.text();alert("Error "+r.status+": "+err);}
    }catch(e){alert("Error de conexión.");}
    setSub(false);
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div style={{background:"#faf7f2",borderRadius:"24px 24px 0 0",width:"100%",maxWidth:480,maxHeight:"92vh",overflowY:"auto",padding:"24px 20px 32px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <h3 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.4rem"}}>{form.id?"Editar producto":"Nuevo producto"}</h3>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#7a6e60"}}>✕</button>
        </div>

        {/* FOTO */}
        <div style={{marginBottom:20,textAlign:"center"}}>
          <div style={{width:120,height:120,margin:"0 auto 10px",borderRadius:16,background:form.imagen_url?"url("+form.imagen_url+") center/cover":"#f0ecf5",backgroundSize:"cover",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"3rem",border:"2px dashed #e0d8cc",overflow:"hidden"}}>
            {!form.imagen_url&&(form.emoji||"📷")}
          </div>
          <label style={{display:"inline-block",padding:"8px 20px",background:"#c8902a",color:"white",borderRadius:50,fontSize:13,cursor:"pointer",fontWeight:500}}>
            {sub?"Subiendo…":"📷 "+(form.imagen_url?"Cambiar foto":"Subir foto")}
            <input type="file" accept="image/*" onChange={subirFoto} style={{display:"none"}} disabled={sub}/>
          </label>
          {form.imagen_url&&<button onClick={()=>s("imagen_url",null)} style={{display:"block",margin:"8px auto 0",fontSize:12,color:"#999",background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>Quitar foto</button>}
        </div>

        {[{l:"Nombre",k:"nombre"},{l:"Descripción",k:"descripcion"},{l:"Precio ($)",k:"precio",n:true},{l:"Stock",k:"stock",n:true},{l:"Emoji",k:"emoji"}].map(f=>(
          <div key={f.k} style={{marginBottom:12}}>
            <label style={{fontSize:12,color:"#7a6e60",display:"block",marginBottom:4}}>{f.l}</label>
            <input type={f.n?"number":"text"} value={form[f.k]===0?0:(form[f.k]||"")} onChange={e=>s(f.k,f.n?Number(e.target.value):e.target.value)} style={{...I()}}/>
          </div>
        ))}

        <div style={{marginBottom:12}}>
          <label style={{fontSize:12,color:"#7a6e60",display:"block",marginBottom:4}}>Categoría</label>
          <select value={form.categoria} onChange={e=>s("categoria",e.target.value)} style={{...I()}}>
            {CATS.map(c=><option key={c}>{c}</option>)}
          </select>
        </div>

        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
          <input type="checkbox" id="actv" checked={!!form.activo} onChange={e=>s("activo",e.target.checked)} style={{width:16,height:16}}/>
          <label htmlFor="actv" style={{fontSize:14,cursor:"pointer"}}>Visible en tienda</label>
        </div>

        <button onClick={()=>onGuardar(form)} style={{...B(),marginBottom:10}}>Guardar cambios</button>

        {form.id&&!conf&&<button onClick={()=>setConf(true)} style={{...B("transparent",{color:"#c0392b",border:"1.5px solid #c0392b"})}}>Eliminar producto</button>}
        {conf&&(
          <div style={{background:"rgba(192,57,43,0.06)",border:"1px solid rgba(192,57,43,0.2)",borderRadius:12,padding:"14px 16px",textAlign:"center"}}>
            <div style={{fontSize:13,marginBottom:12,color:"#c0392b"}}>¿Seguro que quieres eliminar este producto?</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>onElim(form.id)} style={{...B("#c0392b",{flex:1})}}>Sí, eliminar</button>
              <button onClick={()=>setConf(false)} style={{...B("transparent",{flex:1,color:"#2e2416",border:"1.5px solid #e0d8cc"})}}>Cancelar</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── CONFIG FORM ── */
function ConfigForm({cfg,onGuardar}){
  const [items,setItems]=useState(cfg.map(c=>({...c})));
  const [pa,setPa]=useState("");
  const [pn,setPn]=useState("");
  const [pc,setPc]=useState("");
  const [pm,setPm]=useState("");
  const LABELS={whatsapp:"WhatsApp (con código de país)",banco:"Banco",titular:"Titular de cuenta",clabe:"CLABE (18 dígitos)",cuenta:"Número de cuenta",concepto:"Concepto de pago"};
  const set=(clave,valor)=>setItems(pr=>pr.map(i=>i.clave===clave?{...i,valor}:i));
  const cambiarPin=()=>{
    if(pa!==getPin()){setPm("❌ PIN actual incorrecto");return;}
    if(pn.length<4){setPm("❌ Mínimo 4 dígitos");return;}
    if(pn!==pc){setPm("❌ Los PINs no coinciden");return;}
    localStorage.setItem("aether_pin",pn);
    setPa("");setPn("");setPc("");
    setPm("✅ PIN cambiado");setTimeout(()=>setPm(""),3000);
  };
  return(
    <div>
      <div style={{background:"white",borderRadius:16,border:"1px solid #e0d8cc",padding:20,marginBottom:16}}>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.3rem",marginBottom:20}}>Cuenta bancaria y contacto</div>
        {items.map(item=>(
          <div key={item.clave} style={{marginBottom:14}}>
            <label style={{fontSize:12,color:"#7a6e60",display:"block",marginBottom:4}}>{LABELS[item.clave]||item.clave}</label>
            <input value={item.valor||""} onChange={e=>set(item.clave,e.target.value)} style={{...I(),background:"#faf7f2"}}/>
          </div>
        ))}
        <button onClick={()=>onGuardar(items)} style={{...B(),marginTop:4}}>Guardar configuración</button>
      </div>
      <div style={{background:"white",borderRadius:16,border:"1px solid #e0d8cc",padding:20}}>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.3rem",marginBottom:20}}>🔐 Cambiar PIN de admin</div>
        {[{l:"PIN actual",v:pa,s:setPa},{l:"PIN nuevo",v:pn,s:setPn},{l:"Confirmar PIN nuevo",v:pc,s:setPc}].map(f=>(
          <div key={f.l} style={{marginBottom:12}}>
            <label style={{fontSize:12,color:"#7a6e60",display:"block",marginBottom:4}}>{f.l}</label>
            <input type="password" value={f.v} onChange={e=>f.s(e.target.value)} maxLength={10} style={{...I(),letterSpacing:"0.2em"}}/>
          </div>
        ))}
        {pm&&<div style={{padding:"8px 12px",borderRadius:10,background:pm.startsWith("✅")?"rgba(34,139,34,0.08)":"rgba(200,50,50,0.08)",fontSize:13,marginBottom:12,color:pm.startsWith("✅")?"#2d7a2d":"#c0392b"}}>{pm}</div>}
        <button onClick={cambiarPin} style={{...B()}}>Cambiar PIN</button>
      </div>
    </div>
  );
}

/* ── ADMIN DE CÓDIGOS POSTALES ── */
const SQL_ZONAS="create table if not exists zonas_cp (\n  cp text primary key,\n  zona text not null,\n  activo boolean not null default true\n);\nalter table zonas_cp enable row level security;\ncreate policy \"zonas_cp_todo\" on zonas_cp\n  for all using (true) with check (true);";
function ZonasCP(){
  const [rows,setRows]=useState([]);
  const [listo,setListo]=useState(false);
  const [sinTabla,setSinTabla]=useState(false);
  const [msg,setMsg]=useState("");
  const [texto,setTexto]=useState("");
  const [zona,setZona]=useState("");
  const [busq,setBusq]=useState("");
  const [zf,setZf]=useState("");
  const [verBajas,setVerBajas]=useState(false);
  const [ocupado,setOcupado]=useState(false);

  useEffect(()=>{
    db("zonas_cp","?select=*").then(r=>{
      if(Array.isArray(r))setRows(r);else setSinTabla(true);
      setListo(true);
    }).catch(()=>{setSinTabla(true);setListo(true);});
  },[]);

  const mapa=mapaCP(rows);
  const conteo={};Object.values(mapa).forEach(z=>{conteo[z]=(conteo[z]||0)+1;});
  const zonas=Object.keys(conteo).sort();
  const bajas=rows.filter(r=>r.activo===false);
  const flash=m=>{setMsg(m);setTimeout(()=>setMsg(""),4000);};

  const guardar=async(lista)=>{
    const r=await dbup("zonas_cp",lista,"cp");
    if(!Array.isArray(r)){setSinTabla(true);flash("❌ No se pudo guardar. Crea primero la tabla zonas_cp (instrucciones abajo).");return false;}
    setRows(pr=>{const m=new Map(pr.map(x=>[x.cp,x]));lista.forEach(x=>m.set(x.cp,x));return [...m.values()];});
    return true;
  };
  const quitarFila=async(cp)=>{await dbdel("zonas_cp","?cp=eq."+cp);setRows(pr=>pr.filter(x=>x.cp!==cp));};

  const alta=async()=>{
    const z=zona.trim();
    if(!z){flash("⚠️ Escribe la zona (alcaldía o municipio)");return;}
    const cps=new Set();let malos=0;
    texto.split(/[\s,;]+/).filter(Boolean).forEach(tok=>{
      const m=tok.match(/^(\d{5})-(\d{5})$/);
      if(m){
        const a=+m[1],b=+m[2];
        if(b>=a&&b-a<=1000){for(let n=a;n<=b;n++)cps.add(String(n).padStart(5,"0"));}else malos++;
      }else if(/^\d{5}$/.test(tok))cps.add(tok);
      else malos++;
    });
    if(!cps.size){flash("⚠️ No encontré códigos postales válidos");return;}
    setOcupado(true);
    const ok=await guardar([...cps].map(cp=>({cp,zona:z,activo:true})));
    setOcupado(false);
    if(ok){setTexto("");flash("✅ "+cps.size+" CP en "+z+(malos?" · "+malos+" ignorados":""));}
  };

  const baja=async(cp,z)=>{
    if(CP_ZONA[cp]){if(await guardar([{cp,zona:z,activo:false}]))flash("CP "+cp+" dado de baja");}
    else{await quitarFila(cp);flash("CP "+cp+" eliminado");}
  };
  const restaurar=async(cp)=>{await quitarFila(cp);flash("CP "+cp+" restaurado");};

  const lista=Object.entries(mapa).filter(([cp,z])=>(!zf||z===zf)&&(!busq||cp.startsWith(busq))).sort((a,b)=>a[0]<b[0]?-1:1);
  const mostrar=lista.slice(0,60);
  const cobertura=busq.length===5?(mapa[busq]?"✅ "+busq+" tiene cobertura ("+mapa[busq]+")":"📦 "+busq+" no tiene cobertura (paquetería)"):"";

  return(
    <div style={{background:"white",borderRadius:16,border:"1px solid #e0d8cc",padding:20,marginTop:16}}>
      <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.3rem",marginBottom:4}}>📍 Zonas de cobertura</div>
      <div style={{fontSize:12,color:"#7a6e60",marginBottom:16,lineHeight:1.5}}>Los códigos postales de esta lista tienen envío sin costo. Cualquier otro se envía por paquetería.</div>

      {listo&&sinTabla&&(
        <div style={{background:"rgba(200,144,42,0.08)",border:"1px solid rgba(200,144,42,0.3)",borderRadius:12,padding:"12px 14px",marginBottom:16,fontSize:12,lineHeight:1.6}}>
          <b>Falta un paso para poder guardar cambios.</b> En Supabase abre <b>SQL Editor</b>, pega esto y toca <b>Run</b>; luego recarga esta pantalla:
          <pre style={{background:"#1a1510",color:"#f0e8d4",padding:10,borderRadius:8,margin:"8px 0",overflowX:"auto",fontSize:11}}>{SQL_ZONAS}</pre>
          <button onClick={()=>{try{navigator.clipboard.writeText(SQL_ZONAS);flash("Copiado");}catch(e){}}} style={{padding:"6px 14px",border:"1.5px solid #c8902a",borderRadius:50,background:"transparent",cursor:"pointer",fontSize:12}}>Copiar SQL</button>
        </div>
      )}

      <div style={{fontSize:11,color:"#7a6e60",letterSpacing:"0.06em",marginBottom:8}}>AGREGAR CÓDIGOS POSTALES</div>
      <input value={zona} onChange={e=>setZona(e.target.value)} list="zonas-lista" placeholder="Zona (ej. Neza, Coyoacán…)" style={{...I(),marginBottom:8}}/>
      <datalist id="zonas-lista">{zonas.map(z=><option key={z} value={z}/>)}</datalist>
      <textarea value={texto} onChange={e=>setTexto(e.target.value)} rows={3} placeholder={"Uno o varios CP separados por coma o espacio.\nTambién rangos: 57000-57099"} style={{...I(),resize:"vertical",marginBottom:8}}/>
      <button onClick={alta} disabled={ocupado} style={{...B("#c8902a"),opacity:ocupado?0.6:1}}>{ocupado?"Guardando…":"Agregar a cobertura"}</button>

      {msg&&<div style={{marginTop:12,padding:"8px 12px",borderRadius:10,background:msg.startsWith("✅")||msg.startsWith("CP")?"rgba(34,139,34,0.08)":"rgba(200,50,50,0.08)",fontSize:13,color:msg.startsWith("✅")||msg.startsWith("CP")?"#2d7a2d":"#c0392b"}}>{msg}</div>}

      <div style={{fontSize:11,color:"#7a6e60",letterSpacing:"0.06em",margin:"22px 0 8px"}}>CONSULTAR / DAR DE BAJA</div>
      <input value={busq} onChange={e=>setBusq(e.target.value.replace(/\D/g,"").slice(0,5))} placeholder="Buscar por código postal" inputMode="numeric" style={{...I(),marginBottom:8}}/>
      {cobertura&&<div style={{fontSize:13,marginBottom:8}}>{cobertura}</div>}
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
        <button onClick={()=>setZf("")} style={{padding:"5px 12px",borderRadius:50,border:"1.5px solid "+(!zf?"#c8902a":"#e0d8cc"),background:!zf?"#c8902a":"white",color:!zf?"white":"#2e2416",cursor:"pointer",fontSize:12}}>Todas ({Object.keys(mapa).length})</button>
        {zonas.map(z=><button key={z} onClick={()=>setZf(zf===z?"":z)} style={{padding:"5px 12px",borderRadius:50,border:"1.5px solid "+(zf===z?"#c8902a":"#e0d8cc"),background:zf===z?"#c8902a":"white",color:zf===z?"white":"#2e2416",cursor:"pointer",fontSize:12}}>{z} ({conteo[z]})</button>)}
      </div>
      <div style={{maxHeight:320,overflowY:"auto",border:"1px solid #f0ece6",borderRadius:12}}>
        {mostrar.length===0&&<div style={{padding:20,textAlign:"center",color:"#7a6e60",fontSize:13}}>Sin resultados</div>}
        {mostrar.map(([cp,z])=>(
          <div key={cp} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",borderBottom:"1px solid #f0ece6",fontSize:13}}>
            <span><b>{cp}</b> <span style={{color:"#7a6e60"}}>· {z}</span></span>
            <button onClick={()=>baja(cp,z)} style={{padding:"4px 12px",border:"1.5px solid #e0d8cc",borderRadius:50,background:"transparent",color:"#c0392b",cursor:"pointer",fontSize:12}}>Quitar</button>
          </div>
        ))}
      </div>
      {lista.length>60&&<div style={{fontSize:11,color:"#7a6e60",marginTop:6}}>Mostrando 60 de {lista.length}. Filtra por zona o busca un CP.</div>}

      {bajas.length>0&&(
        <div style={{marginTop:16}}>
          <button onClick={()=>setVerBajas(v=>!v)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:"#7a6e60",textDecoration:"underline"}}>{verBajas?"Ocultar":"Ver"} dados de baja ({bajas.length})</button>
          {verBajas&&<div style={{maxHeight:200,overflowY:"auto",border:"1px solid #f0ece6",borderRadius:12,marginTop:8}}>
            {bajas.map(r=>(
              <div key={r.cp} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",borderBottom:"1px solid #f0ece6",fontSize:13}}>
                <span><b>{r.cp}</b> <span style={{color:"#7a6e60"}}>· {r.zona}</span></span>
                <button onClick={()=>restaurar(r.cp)} style={{padding:"4px 12px",border:"1.5px solid #2d7a2d",borderRadius:50,background:"transparent",color:"#2d7a2d",cursor:"pointer",fontSize:12}}>Restaurar</button>
              </div>
            ))}
          </div>}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════════ */
function App(){
  const [vista,setVista]=useState("tienda");
  const [pin,setPin]=useState("");
  const [err,setErr]=useState(false);

  const entrar=()=>{
    if(pin===getPin()){
      setVista("admin");
      setPin("");
      setErr(false);
    }else{
      setErr(true);
      setPin("");
    }
  };

  if(vista==="pin")return(
    <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#1a1208",flexDirection:"column",gap:20,padding:24}}>
      <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"2rem",color:"#e0aa4a"}}>☽ Admin</div>
      <input type="password" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()} placeholder="PIN" maxLength={6}
        style={{padding:"12px 20px",border:"2px solid "+(err?"#c0392b":"rgba(200,144,42,0.3)"),borderRadius:50,background:"transparent",color:"white",fontSize:18,outline:"none",textAlign:"center",letterSpacing:"0.3em",width:200}}/>
      {err&&<div style={{color:"#e74c3c",fontSize:13}}>PIN incorrecto</div>}
      <button onClick={entrar} style={{padding:"12px 32px",background:"#c8902a",color:"white",border:"none",borderRadius:50,fontSize:14,cursor:"pointer",fontWeight:500}}>Entrar</button>
      <button onClick={()=>{setVista("tienda");setPin("");setErr(false);}} style={{color:"rgba(240,220,180,0.4)",background:"none",border:"none",cursor:"pointer",fontSize:13}}>Volver</button>
    </div>
  );
  if(vista==="admin")return <Admin onSalir={()=>setVista("tienda")}/>;
  return <Tienda onAdmin={()=>setVista("pin")}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
